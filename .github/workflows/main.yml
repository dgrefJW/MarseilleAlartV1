name: Veille Marseille Alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Mettre à jour les données
        run: python3 MarseilleAlertBuild/scripts/update_data.py

      - name: Publier les données
        run: |
          git config user.name "Marseille Alert Bot"
          git config user.email "actions@users.noreply.github.com"
          git add MarseilleAlertBuild/data/events.json MarseilleAlertBuild/data/weather.json
          git diff --cached --quiet || git commit -m "chore: actualiser la veille Marseille"
          git push
